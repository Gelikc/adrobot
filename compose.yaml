services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: adrobot
      POSTGRES_USER: adrobot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adrobot-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adrobot -d adrobot"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://adrobot:${POSTGRES_PASSWORD:-adrobot-local-only}@db:5432/adrobot
      KEITARO_MODE: ${KEITARO_MODE:-demo}
      KEITARO_URL: ${KEITARO_URL:-}
      KEITARO_API_KEY: ${KEITARO_API_KEY:-}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
